<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>osu! farm finder</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>osu! farm finder</h1>

    <section id="settings" class="card">
      <h2>設定：osu! APIクライアント</h2>
      <p class="note">
        osu! の<a href="https://osu.ppy.sh/home/account/edit#oauth" target="_blank" rel="noopener">アカウント設定 → OAuth</a>で
        「新しいOAuthアプリケーション」を作成し、表示されるクライアントIDとシークレットを入力してください。
        入力内容はこのPCの中にだけ保存され、osu! 以外には送信されません。
      </p>
      <p id="config-status" class="status"></p>
      <form id="config-form">
        <label>クライアントID <input name="clientId" inputmode="numeric" autocomplete="off" required></label>
        <label>クライアントシークレット <input name="clientSecret" type="password" autocomplete="off" required></label>
        <button type="submit">確認して保存</button>
        <button type="button" id="config-delete" class="secondary">保存内容を削除</button>
      </form>
    </section>

    <section id="lookup" class="card">
      <h2>接続確認</h2>
      <form id="user-form">
        <label>ユーザー名 <input name="name" required></label>
        <button type="submit">調べる</button>
      </form>
      <pre id="user-result" class="status"></pre>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
